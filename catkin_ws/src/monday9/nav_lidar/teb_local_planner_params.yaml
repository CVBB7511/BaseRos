TebLocalPlannerROS:
  odom_topic: odom
  teb_autosize: True
  dt_ref: 0.5
  dt_hysteresis: 0.1
  global_plan_overwrite_orientation: True
  max_global_plan_lookahead_dist: 2.0
  feasibility_check_no_poses: 2

  max_vel_x: 0.6
  max_vel_x_backwards: 0.3
  max_vel_y: 0.3
  max_vel_theta: 1.5
  acc_lim_x: 1.0
  acc_lim_y: 1.0
  acc_lim_theta: 1.5

  min_turning_radius: 0.0
  wheelbase: 0.31
  cmd_angle_instead_rotvel: False

  footprint_model:
    type: "circular"
    radius: 0.17
    line_start: [0.0, 0.0]
    line_end: [0.35, 0.0]
    front_offset: 0.35
    front_radius: 0.35
    rear_offset: 0.35
    rear_radius: 0.35
    vertices: [ [0.35, 0.0], [-0.2, -0.25], [0.2, -0.25]]

  xy_goal_tolerance: 0.03
  yaw_goal_tolerance: 0.04
  free_goal_vel: False

  min_obstacle_dist: 0.1
  inflation_dist: 0.4
  include_costmap_obstacles: True
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 25
  costmap_converter_plugin: ""

  no_inner_iterations: 1
  no_outer_iterations: 1
  penalty_epsilon: 0.1
  weight_max_vel_x: 2
  weight_max_vel_y: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 1
  weight_acc_lim_y: 1
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 0.5
  weight_kinematics_forward_drive: 0.1
  weight_optimaltime: 1
  weight_obstacle: 50

  enable_homotopy_class_planning: True
  enable_multithreading: False
  max_number_classes: 1
  selection_cost_hysteresis: 1.0
  selection_obst_cost_scale: 1.0
  selection_alternative_time_cost: False
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5
