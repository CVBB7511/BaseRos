<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Control</title>
  <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    .status {
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .connected { background: #d4edda; color: #155724; }
    .disconnected { background: #f8d7da; color: #721c24; }
    .control-panel, .telemetry, .camera-panel, .map-panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 24px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #007bff;
      color: white;
    }
    button:active { background: #0056b3; }
    button.emergency { background: #dc3545; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 6px; }
    /* 统一输入框样式：加入 min-width: 0 彻底解决 Flex 溢出问题 */
    input, select { 
      padding: 8px 10px; font-size: 14px; border-radius: 4px; 
      border: 1px solid #ddd; box-sizing: border-box; 
      min-width: 0; 
    }
  </style>
</head>
<body>

  <h1>🤖 Robot 操控面板</h1>

  <!-- 连接状态 -->
  <div id="status" class="status disconnected">🔴 未连接</div>

  <!-- 摄像头区 -->
  <div class="camera-panel">
    <h3>📹 摄像头</h3>
    <img id="camera-image" src="" alt="摄像头画面" 
       style="width:100%; max-width:560px; border-radius:8px; display:none;">
    <div id="camera-status" style="color:#888; padding:20px;">等待摄像头连接...</div>
  </div>

  <!-- 地图区 -->
  <div class="map-panel">
    <h3>🗺️ 实时地图 
      <button id="view-mode-btn" onclick="toggleViewMode()" style="padding: 6px 12px; font-size: 12px; float: right; background: #17a2b8;">🎯 视角: 跟随机器人</button>
    </h3>
    <div style="position: relative; width: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; border-radius: 8px; background: #f0f0f0;">
      <canvas id="map-canvas" style="display: block; width: 100%; height: auto; border-radius: 8px;"></canvas>
      <canvas id="scan-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; pointer-events: none;"></canvas>
      <canvas id="robot-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; pointer-events: none;"></canvas>
    </div>
    <div style="margin-top: 10px; font-size: 12px; color: #666; text-align: center;">
      分辨率: <span id="map-resolution">-</span> | 
      实际大小: <span id="map-size">-</span> | 
      数据源: <span id="pose-source" style="font-weight:bold;color:#007bff;">ODOM</span>
    </div>
  </div>

  <!-- 资产管理区 (平台与托盘) -->
  <div class="map-panel">
    <h3>🏗️ 资产管理 (平台与托盘)</h3>
    <div style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-weight: bold; color: #555;">📦 注册托盘</span>
        <button onclick="loadAssetList('pallet')" style="background: #6c757d; padding: 4px 8px; font-size: 12px; margin: 0;">🔄 刷新列表</button>
      </div>
      <!-- 第一行 -->
      <div style="display: flex; gap: 6px; margin-bottom: 6px;">
        <input type="text" id="p-name" placeholder="名称" style="flex: 1.5;">
        <input type="number" id="p-x" placeholder="X" style="flex: 1;">
        <input type="number" id="p-y" placeholder="Y" style="flex: 1;">
      </div>
      <!-- 第二行 -->
      <div style="display: flex; gap: 6px; margin-bottom: 6px;">
        <input type="number" id="p-z" placeholder="Z" style="flex: 1;">
        <input type="number" id="p-l" placeholder="长" style="flex: 1;">
        <input type="number" id="p-w" placeholder="宽" style="flex: 1;">
      </div>
      <button id="pallet-add-btn" onclick="addAsset('pallet')" style="width: 100%; padding: 8px; background:#8e44ad;">添加托盘</button>
      <div id="pallet-status" style="font-size: 12px; margin-top: 5px;"></div>
      <!-- 重新找回的托盘列表容器 -->
      <div id="pallet-list" style="max-height: 120px; overflow-y: auto; margin-top: 10px; font-size: 13px;">等待获取...</div>
    </div>

    <div style="margin-bottom: 15px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-weight: bold; color: #555;">🏢 注册平台</span>
        <button onclick="loadAssetList('platform')" style="background: #6c757d; padding: 4px 8px; font-size: 12px; margin: 0;">🔄 刷新列表</button>
      </div>
      <!-- 第一行 -->
      <div style="display: flex; gap: 6px; margin-bottom: 6px;">
        <input type="text" id="pl-name" placeholder="名称" style="flex: 1.5;">
        <input type="number" id="pl-x" placeholder="X" style="flex: 1;">
        <input type="number" id="pl-y" placeholder="Y" style="flex: 1;">
      </div>
      <!-- 第二行 -->
      <div style="display: flex; gap: 6px; margin-bottom: 6px;">
        <input type="number" id="pl-z" placeholder="Z" style="flex: 1;">
        <input type="number" id="pl-l" placeholder="长" style="flex: 1;">
        <input type="number" id="pl-w" placeholder="宽" style="flex: 1;">
      </div>
      <button id="platform-add-btn" onclick="addAsset('platform')" style="width: 100%; padding: 8px; background:#e67e22;">添加平台</button>
      <div id="platform-status" style="font-size: 12px; margin-top: 5px;"></div>
      <!-- 重新找回的平台列表容器 -->
      <div id="platform-list" style="max-height: 120px; overflow-y: auto; margin-top: 10px; font-size: 13px;">等待获取...</div>
    </div>
  </div>

  <!-- 分配区 -->
  <div class="map-panel">
    <h3>🎨 货物颜色分配</h3>
    <div style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
      <div style="display: flex; gap: 6px; margin-bottom: 5px;">
        <input type="text" id="c-name" placeholder="输入货物颜色 (如: 红色)" style="flex: 2;">
        <button onclick="addColor()" style="padding: 8px 12px; flex: 1;">添加颜色</button>
      </div>
      <div id="color-status" style="font-size: 12px; margin-top: 5px;"></div>
      <div id="color-list" style="margin-top: 5px; font-size: 12px; color: #555;">等待获取...</div>
    </div>
    
    <div>
      <div style="display: flex; gap: 6px; margin-bottom: 5px;">
        <select id="alloc-color" style="flex: 1;"><option value="">选择颜色</option></select>
        <select id="alloc-pallet" style="flex: 1;"><option value="">选择托盘</option></select>
      </div>
      <button onclick="addAllocation()" style="width: 100%; padding: 8px; background:#6f42c1;">分配到托盘</button>
      <div id="alloc-status" style="font-size: 12px; margin-top: 5px;"></div>
      <div id="alloc-list" style="margin-top: 10px; font-size: 13px; color: #333; max-height: 100px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- 地图管理区 -->
  <div class="map-panel">
    <h3>🗺️ 建图控制</h3>
    <div style="display: flex; gap: 6px; margin-bottom: 15px;">
      <select id="map-list" style="flex: 2;"><option value="">加载已有地图列表...</option></select>
      <button onclick="loadSelectedMap()" style="flex: 1; padding: 10px; background: #28a745;">加载</button>
      <button onclick="deleteSelectedMap()" style="padding: 10px 14px; background: #dc3545;">🗑</button>
    </div>
    
    <div style="margin-bottom: 15px;">
      <input type="text" id="map-name" placeholder="输入建图保存名称（如：room_01）" style="width: 100%;">
    </div>
    <div style="display: flex; justify-content: space-between;">
      <button id="start-mapping-btn" onclick="startMapping()" style="width: 48%; background: #28a745;">▶️ 开始建图</button>
      <button id="stop-mapping-btn" onclick="stopMapping()" style="width: 48%; background: #dc3545; display: none;">⏹️ 停止建图</button>
    </div>
    <button onclick="saveMap()" style="width: 100%; margin-top: 10px; background: #17a2b8;">💾 保存地图</button>
    <div id="mapping-status" style="color: #888; margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 4px; text-align: center;">
      ⏸️ 建图未启动
    </div>
  </div>

  <!-- 操控区 -->
  <div class="control-panel">
    <h3>🎮 速度控制</h3>
    <button onclick="moveForward()">⬆️ 前进</button>
    <button onclick="moveBackward()">⬇️ 后退</button><br>
    <button onclick="turnLeft()">⬅️ 左转</button>
    <button onclick="turnRight()">➡️ 右转</button><br>
    <button onclick="stopRobot()" style="margin-top:10px;">⏹️ 停止</button>
    <button class="emergency" onclick="emergencyStop()">🚨 急停</button>
  </div>

  <!-- 任务控制区 -->
  <div class="map-panel">
    <h3>🚀 任务控制与分拣码垛</h3>
    <div style="display: flex; gap: 6px; margin-bottom: 10px;">
      <select id="task-platform" style="flex: 1;"><option value="">选择取货平台</option></select>
      <input type="number" id="task-total" placeholder="货物总数 (如: 10)" style="flex: 1;">
    </div>
    
    <div style="display: flex; gap: 6px; margin-bottom: 10px; align-items: center;">
      <span style="font-size: 14px; color: #555; white-space: nowrap;">跺型设置:</span>
      <input type="number" id="task-l-count" placeholder="长个数 (如: 3)" style="flex: 1;">
      <span style="color: #888;">×</span>
      <input type="number" id="task-w-count" placeholder="宽个数 (如: 3)" style="flex: 1;">
    </div>

    <div style="display: flex; gap: 6px;">
      <button onclick="startTask()" style="flex: 1; background: #28a745;">▶️ 发布任务</button>
      <button onclick="stopTask()" style="flex: 1; background: #dc3545;">⏹️ 停止任务</button>
    </div>

    <!-- 进度显示 -->
    <div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px; border: 1px solid #eee;">
      <div id="task-status" style="margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px;">状态: 待命</div>
      <div style="width: 100%; background: #e9ecef; border-radius: 4px; height: 12px; overflow: hidden; margin-bottom: 8px;">
        <div id="task-progress-bar" style="width: 0%; height: 100%; background: #007bff; transition: width 0.3s ease;"></div>
      </div>
      <pre id="task-log" style="font-size: 12px; height: 100px; overflow-y: auto; margin: 0; background: #fff; border: 1px solid #ddd; padding: 8px;">等待任务日志...</pre>
    </div>
  </div>

  <!-- 遥测数据 -->
  <div class="telemetry">
    <h3>📡 里程计</h3>
    <pre id="odom-data">等待数据...</pre>
  </div>

<script>
// ==========================================
// 1. 初始化 DOM 与 ROS 配置
// ==========================================
const statusDiv = document.getElementById('status');
const mapCanvas = document.getElementById('map-canvas');
const scanCanvas = document.getElementById('scan-canvas');
const robotCanvas = document.getElementById('robot-canvas');
const mapCtx = mapCanvas.getContext('2d');
const scanCtx = scanCanvas.getContext('2d');
const robotCtx = robotCanvas.getContext('2d');

const cameraImage = document.getElementById('camera-image');
const cameraStatus = document.getElementById('camera-status');
const mapListSelect = document.getElementById('map-list');
const mappingStatusDiv = document.getElementById('mapping-status');

const ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });

ros.on('connection', () => { 
  statusDiv.textContent = '🟢 已连接到 ROS'; 
  statusDiv.className = 'status connected'; 
  refreshMapList(); 
  loadAssetList('pallet'); 
  loadAssetList('platform');
  loadColorsAndAllocations();
});
ros.on('close', () => { statusDiv.textContent = '🔴 连接断开'; statusDiv.className = 'status disconnected'; });

let mapData = null;
let robotPose = { x: 0, y: 0, theta: 0 };
let globalPallets = []; 
let globalPlatforms = []; 
let globalAllocations = {}; 
let useTfForPose = false; 
let needRedraw = false;
let viewMode = 'follow'; 

function getYawFromQuaternion(q) { return Math.atan2(2 * (q.w * q.z + q.x * q.y), 1 - 2 * (q.y * q.y + q.z * q.z)); }
function toggleViewMode() {
  viewMode = (viewMode === 'follow') ? 'global' : 'follow';
  document.getElementById('view-mode-btn').innerHTML = viewMode === 'follow' ? '🎯 视角: 跟随机器人' : '🗺️ 视角: 全局预览';
  needRedraw = true;
}

// ==========================================
// 2. 货物分配与颜色管理
// ==========================================
function loadColorsAndAllocations() {
  new ROSLIB.Service({ ros: ros, name: '/get_colors', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
    if (res.success) {
      try {
        const colors = JSON.parse(res.message);
        const cList = document.getElementById('color-list');
        const cSelect = document.getElementById('alloc-color');
        cList.innerHTML = '';
        cSelect.innerHTML = '<option value="">选择颜色</option>';
        colors.forEach(c => {
          const opt = document.createElement('option'); opt.value = c; opt.textContent = c; cSelect.appendChild(opt);
          const span = document.createElement('span');
          span.style.cssText = 'display:inline-block;background:#f0f0f0;padding:2px 6px;margin:2px;border-radius:3px;font-size:12px;';
          span.innerHTML = c + ' <button onclick="deleteColor(\''+c+'\')" style="padding:0 4px;font-size:10px;background:#dc3545;color:#fff;border:none;border-radius:2px;cursor:pointer;">✕</button>';
          cList.appendChild(span);
        });
        if (!colors.length) cList.innerHTML = '<span style="color:#888;">无</span>';
      } catch(e){}
    }
  });

  new ROSLIB.Service({ ros: ros, name: '/get_allocations', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
    if (res.success) {
      try {
        globalAllocations = JSON.parse(res.message);
        needRedraw = true; 
        const aList = document.getElementById('alloc-list');
        aList.innerHTML = '';
         if(Object.keys(globalAllocations).length === 0) { aList.innerHTML = '暂无分配记录'; return; }
        for (const [pallet, color] of Object.entries(globalAllocations)) {
          const div = document.createElement('div');
          div.style.marginBottom = '5px';
          div.innerHTML = `托盘 <b>${pallet}</b> 绑定了: <span style="color:#007bff; font-weight:bold;">${color}</span>
            <button onclick="deleteAllocation('${pallet}')" style="padding:0 6px;font-size:10px;background:#dc3545;color:#fff;border:none;border-radius:2px;cursor:pointer;margin-left:8px;">✕ 解除</button>`;
          aList.appendChild(div);
        }
      } catch(e){}
    }
  });
}

function addColor() {
  const name = document.getElementById('c-name').value.trim();
  const stat = document.getElementById('color-status');
  if(!name) { stat.textContent='❌ 输入不能为空'; stat.style.color='red'; return; }
  stat.textContent='⏳ 添加中...'; stat.style.color='#007bff';
  
  new ROSLIB.Param({ ros: ros, name: '/new_color_data' }).set(name);
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: '/add_color', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      if(res.success) { stat.textContent='✅ 添加成功'; stat.style.color='green'; document.getElementById('c-name').value=''; loadColorsAndAllocations(); }
      else { stat.textContent='❌ 失败'; stat.style.color='red'; }
    });
  }, 200);
}

function addAllocation() {
  const color = document.getElementById('alloc-color').value;
  const pallet = document.getElementById('alloc-pallet').value;
  const stat = document.getElementById('alloc-status');
  
  if(!color || !pallet) { stat.textContent='❌ 请完整选择'; stat.style.color='red'; return; }
  stat.textContent='⏳ 绑定中...'; stat.style.color='#007bff';

  new ROSLIB.Param({ ros: ros, name: '/new_allocation_data' }).set(JSON.stringify({ pallet, color }));
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: '/add_allocation', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      if(res.success) { stat.textContent='✅ 绑定成功'; stat.style.color='green'; loadColorsAndAllocations(); }
      else { stat.textContent='❌ 失败'; stat.style.color='red'; }
    });
  }, 200);
}

// ==========================================
// 3. 资产管理与渲染还原
// ==========================================
function loadAssetList(type) {
  const isPallet = type === 'pallet';
  const srvName = isPallet ? '/get_pallets' : '/get_platforms';
  const listDiv = document.getElementById(isPallet ? 'pallet-list' : 'platform-list');
  
  new ROSLIB.Service({ ros: ros, name: srvName, serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
    if (res.success) {
      try {
        const items = JSON.parse(res.message);
        if (isPallet) {
          globalPallets = items;
          const pSelect = document.getElementById('alloc-pallet');
          pSelect.innerHTML = '<option value="">选择托盘</option>';
          items.forEach(p => { const opt = document.createElement('option'); opt.value = p.name; opt.textContent = p.name; pSelect.appendChild(opt); });
        } else { 
          globalPlatforms = items; 
          const platSelect = document.getElementById('task-platform');
          platSelect.innerHTML = '<option value="">选择取货平台</option>';
          items.forEach(p => { 
            const opt = document.createElement('option'); 
            opt.value = p.name; opt.textContent = p.name; 
            platSelect.appendChild(opt); 
          });
        }
        needRedraw = true; 
        
        if (listDiv) {
          listDiv.innerHTML = '';
          if (items.length === 0) {
            listDiv.innerHTML = '<div style="color:#888; text-align:center;">暂无记录</div>';
          } else {
            items.forEach(p => {
              const div = document.createElement('div');
              div.style.cssText = 'background: #fff; border: 1px solid #eee; padding: 8px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;';
              const hiddenMap = isPallet ? hiddenPallets : hiddenPlatforms;
              const checked = !hiddenMap[p.name];
              div.innerHTML = `<div style="display:flex;align-items:center;gap:6px;"><input type="checkbox" ${checked?'checked':''} onchange="toggleAssetVisibility('${type}','${p.name}',this.checked)" style="margin:0;">
                <b>${p.name}</b> <span style="color:#888;font-size:11px;">(X:${p.x}, Y:${p.y}, Z:${p.z})</span></div>
                <div><span style="font-size:11px;color:#555;margin-right:8px;">${p.l}m × ${p.w}m</span>
                <button onclick="editAsset('${type}','${p.name}',${p.x},${p.y},${p.z},${p.l},${p.w})" style="padding:2px 6px;font-size:11px;margin:0 2px;background:#ffc107;color:#000;">✎</button>
                <button onclick="deleteAsset('${type}','${p.name}')" style="padding:2px 6px;font-size:11px;margin:0;background:#dc3545;">✕</button></div>`;
              listDiv.appendChild(div);
            });
          }
        }
      } catch (e) {}
    }
  });
}

let editingPallet = '';   // 正在编辑的托盘名称
let editingPlatform = ''; // 正在编辑的平台名称
let hiddenPallets = {};   // 隐藏的托盘
let hiddenPlatforms = {}; // 隐藏的平台

function addAsset(type) {
  const isPallet = type === 'pallet';
  const prefix = isPallet ? 'p-' : 'pl-';
  const stat = document.getElementById(isPallet ? 'pallet-status' : 'platform-status');
  
  const name = document.getElementById(prefix+'name').value.trim();
  const x = parseFloat(document.getElementById(prefix+'x').value);
  const y = parseFloat(document.getElementById(prefix+'y').value);
  const z = parseFloat(document.getElementById(prefix+'z').value);
  const l = parseFloat(document.getElementById(prefix+'l').value);
  const w = parseFloat(document.getElementById(prefix+'w').value);

  if (!name || isNaN(x) || isNaN(y) || isNaN(z) || isNaN(l) || isNaN(w)) { stat.innerHTML = '❌ 填写不完整'; stat.style.color = 'red'; return; }
  stat.innerHTML = '⏳ 保存中...'; stat.style.color = '#ffc107';

  // 判断是更新还是新增
  const editing = isPallet ? editingPallet : editingPlatform;
  const isUpdate = (editing !== '');

  const paramData = JSON.stringify({ name, x, y, z, l, w });
  const paramName = isPallet ? (isUpdate ? '/update_pallet_data' : '/new_pallet_data')
                              : (isUpdate ? '/update_platform_data' : '/new_platform_data');
  const srvName = isPallet ? (isUpdate ? '/update_pallet' : '/add_pallet')
                           : (isUpdate ? '/update_platform' : '/add_platform');

  new ROSLIB.Param({ ros: ros, name: paramName }).set(paramData);
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: srvName, serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      if (res.success) {
        stat.innerHTML = isUpdate ? '✅ 已更新' : '✅ 添加成功'; stat.style.color = 'green';
        ['name','x','y','z','l','w'].forEach(k => document.getElementById(prefix+k).value = '');
        if (isPallet) editingPallet = ''; else editingPlatform = '';
        updateAssetBtn(type);
        loadAssetList(type);
      } else { stat.innerHTML = '❌ 失败'; stat.style.color = 'red'; }
    });
  }, 300);
}

function deleteAsset(type, name) {
  if (!confirm('确认删除 ' + type + '【' + name + '】？此操作不可恢复。')) return;
  const isPallet = type === 'pallet';
  const paramName = isPallet ? '/delete_pallet_name' : '/delete_platform_name';
  const srvName = isPallet ? '/delete_pallet' : '/delete_platform';
  new ROSLIB.Param({ ros: ros, name: paramName }).set(name);
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: srvName, serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      if (res.success) { loadAssetList(type); loadColorsAndAllocations(); }
      else { alert('删除失败: ' + res.message); }
    });
  }, 200);
}

function editAsset(type, name, x, y, z, l, w) {
  const isPallet = type === 'pallet';
  const prefix = isPallet ? 'p-' : 'pl-';
  document.getElementById(prefix+'name').value = name;
  document.getElementById(prefix+'x').value = x;
  document.getElementById(prefix+'y').value = y;
  document.getElementById(prefix+'z').value = z;
  document.getElementById(prefix+'l').value = l;
  document.getElementById(prefix+'w').value = w;
  if (isPallet) editingPallet = name; else editingPlatform = name;
  updateAssetBtn(type);
}

function updateAssetBtn(type) {
  const isPallet = type === 'pallet';
  const editing = isPallet ? editingPallet : editingPlatform;
  const btn = document.getElementById(isPallet ? 'pallet-add-btn' : 'platform-add-btn');
  btn.textContent = (editing !== '') ? '更新' + (isPallet ? '托盘' : '平台') : (isPallet ? '添加托盘' : '添加平台');
  btn.style.background = (editing !== '') ? '#28a745' : (isPallet ? '#8e44ad' : '#e67e22');
}

function deleteColor(name) {
  if (!confirm('确认删除颜色【' + name + '】？')) return;
  new ROSLIB.Param({ ros: ros, name: '/delete_color_name' }).set(name);
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: '/delete_color', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      if (res.success) { loadColorsAndAllocations(); }
      else { alert('删除失败: ' + res.message); }
    });
  }, 200);
}

function deleteAllocation(pallet) {
  if (!confirm('确认解除托盘【' + pallet + '】的颜色分配？')) return;
  new ROSLIB.Param({ ros: ros, name: '/delete_allocation_pallet' }).set(pallet);
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: '/delete_allocation', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      if (res.success) { loadColorsAndAllocations(); }
      else { alert('删除失败: ' + res.message); }
    });
  }, 200);
}

// ==========================================
// 4. ROS话题与地图管理 
// ==========================================
const cmdVel = new ROSLIB.Topic({ ros: ros, name: '/cmd_vel', messageType: 'geometry_msgs/Twist' });
const odomListener = new ROSLIB.Topic({ ros: ros, name: '/odom', messageType: 'nav_msgs/Odometry' });
const mapTopic = new ROSLIB.Topic({ ros: ros, name: '/map', messageType: 'nav_msgs/OccupancyGrid' });
const imageTopic = new ROSLIB.Topic({ ros: ros, name: '/kinect2/hd/image_color_rect/compressed', messageType: 'sensor_msgs/CompressedImage' });

imageTopic.subscribe((message) => { cameraImage.src = 'data:image/jpeg;base64,' + message.data; cameraImage.style.display = 'block'; cameraStatus.style.display = 'none'; });

const tfClient = new ROSLIB.TFClient({ ros: ros, angularThres: 0.01, transThres: 0.01, rate: 10.0, fixedFrame: 'map' });
tfClient.subscribe('base_link', function(tf) {
  useTfForPose = true; document.getElementById('pose-source').textContent = 'TF (map->base_link)';
  robotPose.x = tf.translation.x; robotPose.y = tf.translation.y; robotPose.theta = getYawFromQuaternion(tf.rotation); needRedraw = true;
});

odomListener.subscribe((message) => {
  const pos = message.pose.pose.position; const orient = message.pose.pose.orientation;
  document.getElementById('odom-data').textContent = `位置:  x=${pos.x.toFixed(3)}  y=${pos.y.toFixed(3)}\n方向:  yaw=${getYawFromQuaternion(orient).toFixed(3)}`;
  if (!useTfForPose) { robotPose.x = pos.x; robotPose.y = pos.y; robotPose.theta = getYawFromQuaternion(orient); needRedraw = true; }
});

mapTopic.subscribe((message) => { mapData = message; document.getElementById('map-resolution').textContent = message.info.resolution.toFixed(3) + ' m/pix'; needRedraw = true; });

function refreshMapList() {
  new ROSLIB.Service({ ros: ros, name: '/list_maps', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
    mapListSelect.innerHTML = '<option value="">请选择加载...</option>';
    if (res.success && res.message !== "NONE") { res.message.split(',').forEach(m => { let opt = document.createElement('option'); opt.value = m; opt.textContent = m; mapListSelect.appendChild(opt); }); }
  });
}
function loadSelectedMap() {
  const targetMap = mapListSelect.value; if (!targetMap) return;
  mappingStatusDiv.innerHTML = '⏳ 加载中...'; mappingStatusDiv.style.color = '#ffc107';
  new ROSLIB.Param({ ros: ros, name: '/current_map_name' }).set(targetMap);
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: '/load_map', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      mappingStatusDiv.innerHTML = res.success ? '✅ ' + res.message : '❌ ' + res.message; mappingStatusDiv.style.color = res.success ? '#28a745' : '#dc3545';
      if (res.success && viewMode === 'follow') toggleViewMode();
    });
  }, 500);
}
function deleteSelectedMap() {
  const targetMap = mapListSelect.value; if (!targetMap) return;
  if (!confirm('确认删除地图【' + targetMap + '】？此操作不可恢复。')) return;
  mappingStatusDiv.innerHTML = '⏳ 删除中...'; mappingStatusDiv.style.color = '#ffc107';
  new ROSLIB.Param({ ros: ros, name: '/delete_map_name' }).set(targetMap);
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: '/delete_map', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      mappingStatusDiv.innerHTML = (res.success ? '✅ ' : '❌ ') + res.message; mappingStatusDiv.style.color = res.success ? '#28a745' : '#dc3545';
      if (res.success) refreshMapList();
    });
  }, 300);
}
function saveMap() {
  const m = document.getElementById('map-name').value.trim(); if (!m) { alert('请输入地图名称'); return; }
  mappingStatusDiv.innerHTML = '⏳ 保存中...';
  new ROSLIB.Param({ ros: ros, name: '/current_map_name' }).set(m);
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: '/save_map', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      mappingStatusDiv.innerHTML = (res.success ? '✅ ' : '❌ ') + res.message; mappingStatusDiv.style.color = res.success ? '#28a745' : '#dc3545';
      if (res.success) refreshMapList(); 
    });
  }, 500);
}
function startMapping() {
  mappingStatusDiv.innerHTML = '⏳ 正在清理场地并启动建图...'; mappingStatusDiv.style.color = '#ffc107';
  if (viewMode === 'global') { viewMode = 'follow'; document.getElementById('view-mode-btn').innerHTML = '🎯 视角: 跟随机器人'; needRedraw = true; }
  new ROSLIB.Service({ ros: ros, name: '/stop_map_server', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function() {
    new ROSLIB.Service({ ros: ros, name: '/start_gmapping', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      if(res.success){ document.getElementById('start-mapping-btn').style.display='none'; document.getElementById('stop-mapping-btn').style.display='inline-block'; mappingStatusDiv.innerHTML = '✅ 建图进行中...'; mappingStatusDiv.style.color = '#28a745'; mappingStatusDiv.style.background = '#d4edda'; }
    });
  });
}
function stopMapping() {
  new ROSLIB.Service({ ros: ros, name: '/stop_gmapping', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
    if(res.success){ document.getElementById('start-mapping-btn').style.display='inline-block'; document.getElementById('stop-mapping-btn').style.display='none'; mappingStatusDiv.innerHTML = '⏸️ 建图已停止'; mappingStatusDiv.style.color = '#888'; mappingStatusDiv.style.background = '#f8f9fa'; }
  });
}

// ==========================================
// 5. 画布绘制引擎
// ==========================================
function toggleAssetVisibility(type, name, visible) {
  const hiddenMap = (type === 'pallet') ? hiddenPallets : hiddenPlatforms;
  if (visible) { delete hiddenMap[name]; }
  else { hiddenMap[name] = true; }
  needRedraw = true;
}

function drawAssets(dw, dh, res, origin, pxMin, pyMax, items, color, type) {
  if (items.length === 0 || !mapData) return;
  const hiddenMap = (type === 'pallet') ? hiddenPallets : hiddenPlatforms;
  robotCtx.save();
  robotCtx.strokeStyle = color; robotCtx.lineWidth = 2;
  robotCtx.font = 'bold 12px "Segoe UI", sans-serif'; robotCtx.fillStyle = color; robotCtx.textAlign = 'center';

  items.forEach(p => {
    if (hiddenMap[p.name]) return;  // 跳过隐藏项
    const cx = (p.x - origin.position.x) / res - pxMin;
    const cy = pyMax - ((p.y - origin.position.y) / res);
    const wPix = p.l / res; const hPix = p.w / res;
    if (cx + wPix/2 < 0 || cx - wPix/2 > dw || cy + hPix/2 < 0 || cy - hPix/2 > dh) return;
    
    robotCtx.strokeRect(cx - wPix/2, cy - hPix/2, wPix, hPix);
    robotCtx.fillText(p.name, cx, cy - hPix/2 - 6);

    if (type === 'pallet' && globalAllocations[p.name]) {
      robotCtx.font = 'bold 11px sans-serif';
      robotCtx.fillStyle = '#007bff'; 
      robotCtx.fillText(`[${globalAllocations[p.name]}]`, cx, cy + 4); 
      robotCtx.fillStyle = color; 
    }
  });
  robotCtx.restore();
}

function drawMap() {
  if (!mapData) return;
  const width = mapData.info.width; const height = mapData.info.height;
  const res = mapData.info.resolution; const origin = mapData.info.origin;
  let pxMin, pxMax, pyMin, pyMax;

  if (viewMode === 'global') {
    let minX = width, maxX = 0, minY = height, maxY = 0; let hasData = false;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (mapData.data[y * width + x] !== -1) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y; hasData = true;
        }
      }
    }
    if (hasData) {
      const pad = 10; pxMin = Math.max(0, minX - pad); pxMax = Math.min(width - 1, maxX + pad);
      pyMin = Math.max(0, minY - pad); pyMax = Math.min(height - 1, maxY + pad);
    } else { pxMin = 0; pxMax = width - 1; pyMin = 0; pyMax = height - 1; }
  } else {
    let cx = robotPose ? robotPose.x : (origin.position.x + width * res / 2);
    let cy = robotPose ? robotPose.y : (origin.position.y + height * res / 2);
    const half = 6 / 2;
    pxMin = Math.floor((cx - half - origin.position.x) / res); pxMax = Math.ceil((cx + half - origin.position.x) / res);
    pyMin = Math.floor((cy - half - origin.position.y) / res); pyMax = Math.ceil((cy + half - origin.position.y) / res);
    pxMin = Math.max(0, pxMin); pxMax = Math.min(width - 1, pxMax); pyMin = Math.max(0, pyMin); pyMax = Math.min(height - 1, pyMax);
  }
  
  const drawWidth = pxMax - pxMin + 1; const drawHeight = pyMax - pyMin + 1;
  mapCanvas.width = scanCanvas.width = robotCanvas.width = drawWidth;
  mapCanvas.height = scanCanvas.height = robotCanvas.height = drawHeight;
  const imgData = mapCtx.createImageData(drawWidth, drawHeight);
  
  for (let y = 0; y < drawHeight; y++) {
    for (let x = 0; x < drawWidth; x++) {
      const val = mapData.data[(pxMin + x) + (pyMax - y) * width];
      const pIdx = (y * drawWidth + x) * 4;
      if (val === -1) { imgData.data.set([200, 200, 200, 255], pIdx); } 
      else if (val === 0) { imgData.data.set([255, 255, 255, 255], pIdx); } 
      else { const intensity = Math.floor(255 - (val / 100) * 255); imgData.data.set([intensity, intensity, intensity, 255], pIdx); }
    }
  }
  mapCtx.putImageData(imgData, 0, 0);
  robotCtx.clearRect(0, 0, drawWidth, drawHeight);
  
  drawAssets(drawWidth, drawHeight, res, origin, pxMin, pyMax, globalPallets, '#8e44ad', 'pallet');
  drawAssets(drawWidth, drawHeight, res, origin, pxMin, pyMax, globalPlatforms, '#e67e22', 'platform');
  
  if (robotPose && mapData) {
    const rx = (robotPose.x - origin.position.x) / res - pxMin; const ry = pyMax - ((robotPose.y - origin.position.y) / res);
    if (rx >= -20 && rx <= drawWidth + 20 && ry >= -20 && ry <= drawHeight + 20) {
      robotCtx.save(); robotCtx.translate(rx, ry); robotCtx.rotate(-robotPose.theta);
      robotCtx.beginPath(); robotCtx.moveTo(12, 0); robotCtx.lineTo(-6, -6); robotCtx.lineTo(-6, 6); robotCtx.closePath();
      robotCtx.fillStyle = '#ff0000'; robotCtx.fill(); robotCtx.strokeStyle = '#000'; robotCtx.lineWidth = 1.5; robotCtx.stroke();
      robotCtx.restore();
    }
  }
  document.getElementById('map-size').textContent = `${(drawWidth * res).toFixed(1)}m × ${(drawHeight * res).toFixed(1)}m`;
}

let lastDraw = 0;
function renderLoop(t) { if (needRedraw && (t - lastDraw >= 100)) { drawMap(); needRedraw = false; lastDraw = t; } requestAnimationFrame(renderLoop); }
requestAnimationFrame(renderLoop);

// 控制逻辑
function publishVelocity(x, z) { cmdVel.publish(new ROSLIB.Message({linear:{x:x,y:0,z:0},angular:{x:0,y:0,z:z}})); }
function moveForward() { publishVelocity(0.1, 0); } function moveBackward() { publishVelocity(-0.1, 0); }
function turnLeft() { publishVelocity(0, 0.1); } function turnRight() { publishVelocity(0, -0.1); }
function stopRobot() { publishVelocity(0, 0); } function emergencyStop(){ publishVelocity(0,0); alert('🚨 急停'); }
document.addEventListener('keydown', (e) => { if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); switch(e.key) { case 'ArrowUp':case 'w': moveForward(); break; case 'ArrowDown':case 's': moveBackward(); break; case 'ArrowLeft':case 'a': turnLeft(); break; case 'ArrowRight':case 'd': turnRight(); break; case ' ': stopRobot(); break;} });
document.addEventListener('keyup', (e) => { if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','s','a','d'].includes(e.key)) stopRobot(); });

// ==========================================
// 6. 任务发布与进度监听
// ==========================================
// 订阅任务进度 Topic (接收 JSON 格式的字符串)
const taskProgressTopic = new ROSLIB.Topic({ 
  ros: ros, 
  name: '/task_progress', 
  messageType: 'std_msgs/String' 
});

taskProgressTopic.subscribe((message) => {
  try {
    const data = JSON.parse(message.data);
    document.getElementById('task-status').innerText = '状态: ' + data.status;
    document.getElementById('task-progress-bar').style.width = data.percent + '%';
    
    if (data.log) {
      const logDiv = document.getElementById('task-log');
      const timeStr = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      logDiv.innerHTML += `[${timeStr}] ${data.log}\n`;
      logDiv.scrollTop = logDiv.scrollHeight; // 自动滚动到底部
    }
  } catch (e) { console.error("解析进度数据失败", e); }
});

function startTask() {
  const platform = document.getElementById('task-platform').value;
  const total = parseInt(document.getElementById('task-total').value);
  const lCount = parseInt(document.getElementById('task-l-count').value);
  const wCount = parseInt(document.getElementById('task-w-count').value);

  if (!platform || isNaN(total) || isNaN(lCount) || isNaN(wCount)) {
    alert('❌ 请完整填写任务参数 (平台、总数、跺型)'); return;
  }

  // 清空日志
  document.getElementById('task-log').innerHTML = '正在初始化任务...\n';
  
  const taskData = { platform, total, pattern: { l: lCount, w: wCount } };
  new ROSLIB.Param({ ros: ros, name: '/new_task_data' }).set(JSON.stringify(taskData));
  
  setTimeout(() => {
    new ROSLIB.Service({ ros: ros, name: '/start_task', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
      if (res.success) { console.log('任务已发布'); }
      else { alert('启动失败: ' + res.message); }
    });
  }, 300);
}

function stopTask() {
  new ROSLIB.Service({ ros: ros, name: '/stop_task', serviceType: 'std_srvs/Trigger' }).callService(new ROSLIB.ServiceRequest({}), function(res) {
    if (res.success) { console.log('正在发送停止指令'); }
  });
}
